<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D77D" />
      <stop offset="45%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#9B7A1C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1C" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer ring (from official logo's architectural crest) -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="14" opacity="0.85" />

  <!-- Magnacity "M" Arches — faithful to the official emblem -->
  <!-- Left arch -->
  <path d="M 190 310 V 190 C 190 145, 232 145, 232 190 V 310"
        fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#innerGlow)" />
  <!-- Right arch -->
  <path d="M 280 310 V 190 C 280 145, 322 145, 322 190 V 310"
        fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#innerGlow)" />
  <!-- Crown arch connecting both -->
  <path d="M 190 220 Q 256 140 322 220"
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#innerGlow)" />

  <!-- MAGNACITY text below -->
  <text x="256" y="430" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="700" font-size="50" fill="url(#goldGrad)" letter-spacing="8">MAGNACITY</text>

  <!-- Subtle inner border for premium feel -->
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.2" />
</svg>
