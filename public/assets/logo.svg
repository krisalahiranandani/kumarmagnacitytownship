<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <!-- Left: Kumar Realty -->
  <g transform="translate(10, 10)">
    <!-- Orange Background Circle around 'mar' -->
    <circle cx="140" cy="50" r="42" fill="#E86A17" />
    
    <!-- "Kumar" Text -->
    <text x="0" y="66" font-family="'Playfair Display', 'Georgia', serif" font-weight="900" font-size="52" fill="#E86A17" letter-spacing="-1">Kumar</text>
    <text x="18" y="66" font-family="'Playfair Display', 'Georgia', serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">mar</text>
    <text x="210" y="64" font-family="'Playfair Display', 'Georgia', serif" font-weight="900" font-size="14" fill="#E86A17">®</text>
    
    <!-- "REALTY" Subtitle -->
    <text x="180" y="94" font-family="'Outfit', 'Helvetica', sans-serif" font-weight="800" font-size="20" fill="#E86A17" letter-spacing="4">REALTY</text>
  </g>

  <!-- Vertical Divider Bar -->
  <line x1="285" y1="15" x2="285" y2="105" stroke="#C9A227" stroke-width="4" stroke-linecap="round" />

  <!-- Right: Magnacity Emblem & Text -->
  <g transform="translate(305, 10)">
    <!-- Architectural Circular Crest -->
    <circle cx="100" cy="40" r="32" fill="none" stroke="#C9A227" stroke-width="6" />
    <!-- Stylized "M" Arches inside circle -->
    <path d="M 80 58 V 30 C 80 20, 92 20, 92 30 V 58 M 108 58 V 30 C 108 20, 120 20, 120 30 V 58 M 80 40 Q 100 20 120 40" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- "MAGNACITY" Text -->
    <text x="100" y="98" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="28" fill="#C9A227" letter-spacing="3">MAGNACITY</text>
  </g>
</svg>